<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PPC Karnataka Planner</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" integrity="sha384-c6Rcwz4e4CITMbu/NBmnNS8yN2sC3cUElMEMfP3vqqKFp7GOYaaBBCqmaWBjmkjb" crossorigin="anonymous">
<link rel="stylesheet" href="style.css?v=1">
</head>
<body>
<div id="app">
  <div id="map"></div>
  <aside id="panel">
    <header>
      <div class="brand">📮 PPC Karnataka</div>
      <div id="progress-pill"></div>
      <div id="sync-pill" title="Sync status"></div>
    </header>
    <nav class="tabs">
      <button data-tab="trip" class="active">Trip</button>
      <button data-tab="sites">Sites</button>
      <button data-tab="settings">Settings</button>
    </nav>
    <section id="tab-trip" class="tab active"></section>
    <section id="tab-sites" class="tab"></section>
    <section id="tab-settings" class="tab"></section>
  </aside>
</div>
<div id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js" integrity="sha384-NElt3Op+9NBMCYaef5HxeJmU4Xeard/Lku8ek6hoPTvYkQPh3zLIrJP7KiRocsxO" crossorigin="anonymous"></script>
<script src="app.js?v=2"></script>
</body>
</html>
