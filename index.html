<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PPC Karnataka Passport</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" integrity="sha384-c6Rcwz4e4CITMbu/NBmnNS8yN2sC3cUElMEMfP3vqqKFp7GOYaaBBCqmaWBjmkjb" crossorigin="anonymous">
<link rel="stylesheet" href="style.css?v=4">
</head>
<body>
<div id="app">
  <div id="map"></div>
  <aside id="panel">
    <header>
      <div class="brand">📮 Karnataka Philately Passport</div>
      <div id="sync-pill"></div>
      <button class="btn small" id="account-btn">Sign in</button>
    </header>
    <div class="progress"><div id="progress-bar"></div></div>
    <div class="filters">
      <span id="progress-pill"></span>
      <label class="toggle"><input type="checkbox" id="f-hide"> Hide stamped (pending only)</label>
      <label class="toggle"><input type="checkbox" id="f-extra"> Show extras not in booklet (<span id="f-extra-count"></span>)</label>
    </div>
    <nav class="tabs">
      <button data-tab="list" class="active">Sites</button>
      <button data-tab="account">Account</button>
    </nav>
    <section id="tab-list" class="tab active">
      <input id="q" placeholder="Search number, site, post office, district, PIN">
      <div class="muted small" id="list-count" style="margin:6px 0"></div>
      <div id="list"></div>
    </section>
    <section id="tab-account" class="tab"></section>
  </aside>
</div>
<div id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js" integrity="sha384-NElt3Op+9NBMCYaef5HxeJmU4Xeard/Lku8ek6hoPTvYkQPh3zLIrJP7KiRocsxO" crossorigin="anonymous"></script>
<script type="module" src="app.js?v=4"></script>
</body>
</html>
